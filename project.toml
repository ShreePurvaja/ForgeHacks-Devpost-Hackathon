    "langchain-text-splitters",
    "groq",
    "langgraph",
    "pinecone",
    "deepgram-sdk",
    "pydub",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "pypdf",
    "httpx",
    "websockets",
    "pandas",
    "numpy",
    "gunicorn",
    "langsmith",
    "deepeval",
    "langchain-ollama",
